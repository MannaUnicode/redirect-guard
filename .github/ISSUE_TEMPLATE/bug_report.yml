name: Bug report
description: Something redirect-guard reports wrongly, or a crash.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove credentials, private hostnames and client data
        before pasting output. For security issues use private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: redirect-guard version
      placeholder: "redirect-guard --version"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: "node 22.11.0 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and input
      description: The command you ran and a minimal map (2-3 rows) that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the output, ideally with --verbose or --json.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: http
    attributes:
      label: Raw HTTP behaviour (optional)
      description: "Output of curl -sI <url> for the URLs involved helps a lot."
      render: text
