name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run typecheck

  pack:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tarball file list
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            const bad = files.filter((f) => /^(test|scripts|docs|examples|\.github)\//.test(f) || f === "types/check.ts" || f === "types/tsconfig.json");
            if (bad.length) { console.error("unexpected files in tarball:", bad); process.exit(1); }
            for (const need of ["bin/redirect-guard.js", "src/index.js", "types/index.d.ts", "schema/config.schema.json", "README.md", "LICENSE"]) {
              if (!files.includes(need)) { console.error("missing from tarball:", need); process.exit(1); }
            }
            console.log(files.length + " files OK");
          '
      - name: Install the packed tarball and run the bin
        run: |
          npm pack
          mkdir -p /tmp/rg-install && cd /tmp/rg-install
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/redirect-guard-*.tgz
          npx redirect-guard --version
          node --input-type=module -e "import { check, version } from 'redirect-guard'; if (typeof check !== 'function') process.exit(1); console.log('api ok', version)"
